name: V1.1 isolated OCR benchmark
on:
  push:
    branches: [research/v1-1-ocr-independent-benchmark-20261122]
  pull_request:
    paths:
      - 'benchmarks/ocr_v11/**'
      - '.github/workflows/ocr-benchmark-v11.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test tools
        run: python -m pip install 'pytest==8.3.5'
      - name: Run benchmark integrity unit tests (RED-first)
        run: python -m pytest -q benchmarks/ocr_v11/test_runner.py
