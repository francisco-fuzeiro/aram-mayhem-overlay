name: Python regression tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -e '.[dev,webview-overlay]'
      - name: Run regression suite
        run: python -m pytest -q
      - name: Check overlay JavaScript syntax
        run: node --check frontend/app.js
      - name: Check Settings JavaScript syntax
        run: node --check frontend/settings.js
      - name: Exercise Settings JavaScript interactions
        run: node --test tests/js/settings.test.cjs
