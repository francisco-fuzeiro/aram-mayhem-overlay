name: Python regression tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    env:
      ARAM_REQUIRE_TESSERACT: "1"
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -e '.[dev,webview-overlay]'
      - name: Install Tesseract
        run: choco install tesseract --no-progress -y
      - name: Verify Tesseract
        run: '& "C:\Program Files\Tesseract-OCR\tesseract.exe" --version'
      - name: Verify English traineddata
        run: '& "C:\Program Files\Tesseract-OCR\tesseract.exe" --list-langs'
      - name: Run regression suite
        run: python -m pytest -q
      - name: Check overlay JavaScript syntax
        run: node --check frontend/app.js
      - name: Check Settings JavaScript syntax
        run: node --check frontend/settings.js
      - name: Check overlay preferences JavaScript syntax
        run: node --check frontend/overlay-preferences.js
      - name: Exercise Settings JavaScript interactions
        run: node --test tests/js/settings.test.cjs tests/js/overlay-messages.test.cjs

  v4-real-model:
    # Independent research fixture replay through the ACTUAL product slot
    # entrypoint. This is not native League or an independent holdout.
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      ARAM_ORACLE_V12_REAL_MODEL_TEST: "1"
      ARAM_ORACLE_OCR_ENGINE: "ppocrv4"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verified optional ONNX runtime
        run: python -m pip install -e '.[dev,ocr-v4]'
      - name: Explicitly provision SHA-256 pinned v4 model
        run: python -m scripts.setup_ppocr_v4
      - name: Verify installed model without network
        run: python -m scripts.setup_ppocr_v4 --check
      - name: Exercise actual three-slot recognition and 26 frozen originals
        run: python -m pytest -q tests/test_ocr_v12_ppocrv4.py tests/test_ocr_v12_real_model.py
