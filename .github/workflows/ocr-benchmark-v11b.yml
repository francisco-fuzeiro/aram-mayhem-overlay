name: V1.1b isolated OCR research
on:
  push:
    branches:
      - research/v1-1b-ocr-safety-windows-20261122
  workflow_dispatch:
  pull_request:
    paths:
      - 'benchmarks/ocr_v11b/**'
      - '.github/workflows/ocr-benchmark-v11b.yml'
permissions:
  contents: read
jobs:
  safety-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pytest==8.3.5'
      - name: Run safety integrity tests (test-first)
        run: python -m pytest -q benchmarks/ocr_v11b/test_validation.py
