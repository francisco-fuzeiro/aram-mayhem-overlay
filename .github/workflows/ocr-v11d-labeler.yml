name: V1.1d private labeler safety (no OCR models)
on:
  push:
    branches: [research/v1-1d-ocr-native-labeler-20261122]
  pull_request:
    paths:
      - 'benchmarks/ocr_v11d/**'
      - '.github/workflows/ocr-v11d-labeler.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  labeler-safety:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test-only Pillow and pytest
        run: python -m pip install 'pytest==8.3.5' 'Pillow==11.1.0'
      - name: Verify local-only manual labels and duplicate protection
        run: python -m pytest -q benchmarks/ocr_v11d/test_label_core.py
      - name: Compile GUI and core without launching a window
        run: python -m compileall -q benchmarks/ocr_v11d
      - name: Import native Tk labeler without starting GUI or game
        if: runner.os == 'Windows'
        run: python -c "import tkinter; import PIL.ImageTk; from benchmarks.ocr_v11d.label_ui import Labeler; print('HEADLESS_GUI_IMPORT_OK')"
      - name: Validate Windows PowerShell 5.1 nested offline preflight without downloads
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $temporaryRoot = Join-Path $env:RUNNER_TEMP 'v11d-ps51-no-cache-test'
          $paramsCheck = "(Get-Command './benchmarks/ocr_v11d/Start-OCRLab.ps1').Parameters.Keys -join ','"
          $parameters = (& powershell.exe -NoProfile -ExecutionPolicy Bypass -Command $paramsCheck 2>&1 | Out-String)
          Write-Host "PS51_PARAMS=$parameters"
          if ($parameters -notmatch 'Offline' -or $parameters -notmatch 'OutputRoot') {
            throw 'PowerShell 5.1 failed to parse the launcher named parameters'
          }
          $command = "& './benchmarks/ocr_v11d/Start-OCRLab.ps1' -Offline -OutputRoot '$temporaryRoot'"
          $text = (& powershell.exe -NoProfile -ExecutionPolicy Bypass -Command $command 2>&1 | Out-String)
          Write-Host $text
          if ($LASTEXITCODE -eq 0) { throw 'Empty offline cache must fail closed' }
          if ($text -notmatch 'Reference not cached') {
            throw 'Windows PowerShell 5.1 failed before reaching the expected safe no-cache preflight'
          }
      - name: Parse PowerShell launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'benchmarks/ocr_v11d/Start-OCRLab.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Out-String | Write-Error; exit 1 }
